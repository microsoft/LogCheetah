on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the draft release'
        required: false
        default: v0.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    permissions: write-all
    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - name: Install cmake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

    - name: Install windows 10 sdk
      uses: GuillaumeFalourd/setup-windows10-sdk-action@9979bedbf6ae74f038cc338622ba015942ed2408 # v2.4

    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'true'

    - name: Bootstrap vcpkg
      run:
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Vcpkg Build
      run:
        .\vcpkg\vcpkg install --triplet x64-windows

    - name: Build LogCheetah
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . --config=Release

    - name: Zip Windows Release
      if: matrix.os == 'windows-latest'
      uses: vimtor/action-zip@5f1c4aa587ea41db1110df6a99981dbe19cee310 # v1
      with:
        files: build\LogCheetah\Release
        recursive: true
        dest: buildZipped\\LogCheetah-Windows.zip

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: files
        path: buildZipped\\LogCheetah-Windows.zip

  create_release:
    name: Setup Release
    needs: build
    runs-on: windows-latest
    permissions: write-all

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: files

    - name: Create Draft Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        draft: true
        prerelease: true
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ github.sha }}
        name: ${{ inputs.tag }} NEW DRAFT RELEASE
        generate_release_notes: true
        files: |
          LogCheetah-Windows.zip
